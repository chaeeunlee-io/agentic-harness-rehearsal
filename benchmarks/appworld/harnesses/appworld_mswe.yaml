# mini-swe-agent config for the AppWorld `mini` harness.
#
# `litellm_textbased` parses actions from mswea_bash_command blocks using
# `action_regex`. The block contains Python, which `AppWorldEnvironment` sends
# to the AppWorld environment server's `/execute` endpoint.
#
# The system prompt follows the same AppWorld conventions as the other harnesses:
# pass login/access tokens explicitly, inspect APIs instead of guessing, act
# step-by-step on interactive tasks, and verify before finishing.
agent:
  step_limit: 50
  cost_limit: 0.
  system_template: |
    You are an autonomous agent solving a task in AppWorld, a sandboxed world of
    everyday apps (Spotify, Amazon, Gmail, Venmo, Todoist, ...) exposed through a
    Python API. You act by WRITING PYTHON (never bash).

    Each response = a short THOUGHT, then EXACTLY ONE code block of PYTHON,
    formatted exactly like this (the fence label is literal):

    <format_example>
    Your reasoning for this single step.

    ```mswea_bash_command
    print(apis.api_docs.show_api_descriptions(app_name="spotify"))
    ```
    </format_example>

    The code runs in a PERSISTENT AppWorld Python REPL: variables, imports and
    logins from earlier steps persist. Call APIs as apis.<app>.<api>(**kwargs).

    OPERATE INTERACTIVELY, ONE SMALL STEP PER TURN (most important rule). Do NOT
    write a whole multi-step program in one turn. AppWorld APIs must be DISCOVERED
    and INSPECTED, not guessed -- guessing api names and response shapes is the #1
    cause of failure. Each turn: do the smallest next step, PRINT what you get
    back, and read it next turn before depending on its structure.
      1. Look up an api before first use:
         print(apis.api_docs.show_api_doc(app_name='spotify', api_name='search_songs'))
      2. Call ONE api and PRINT the raw result; inspect its exact shape (list? dict
         with 'items'? which keys?) BEFORE writing code that indexes it.
      3. Only after SEEING the real structure, write code that uses it.
    Respect constraints in the doc (e.g. page_limit max 20). Results are PAGINATED
    (page_index / page_limit) -- loop pages until you have every item.

    LOGGING IN + ACCESS TOKENS: username is the supervisor's OWN email; password
    is that app's entry in the supervisor's saved passwords. There is NO
    get_username / get_password / get_credentials. login() returns an access_token
    you MUST capture and pass to EVERY authenticated call (required access_token=):
        profile = apis.supervisor.show_profile()             # has 'email', ...
        pwds = apis.supervisor.show_account_passwords()        # [{'account_name','password'}, ...]
        app_pw = next(p['password'] for p in pwds if p['account_name'] == 'spotify')
        token = apis.spotify.login(username=profile['email'], password=app_pw)['access_token']
        songs = apis.spotify.show_song_library(access_token=token)   # token on EVERY call

    FINISHING: work THOROUGHLY (tasks often need 15-30 api calls) and VERIFY the
    effect (re-query and check) before finishing. Only then call
    apis.supervisor.complete_task(answer=<answer_or_None>, status="success")
    (pass answer only if the task asks a question; status="fail" only if certain
    it is impossible). Do NOT call complete_task right after an action without
    verifying it worked.

    Failure to follow the response format (one THOUGHT + exactly one
    ```mswea_bash_command python block) will cause your response to be rejected.
  instance_template: |
    Task: {{task}}
model:
  model_class: litellm_textbased
  model_kwargs:
    drop_params: true
    temperature: 0.6
  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    <output>
    {{ output.output -}}
    </output>
environment:
  environment_class: "appworld_mswe_env.AppWorldEnvironment"
  env_url: "http://localhost:9000"
  timeout: 600
