# Shared GRPO recipe: every override that is identical across the reported MAB and RG runs,
# copied from the as-run GRPO wrappers. Benchmark-specific keys
# (data, band, harnesses, harness kwargs, agent) live in configs/benchmarks/<b>.yaml `rl:`.
# Rendered by `exp grpo`.
entrypoint: examples.train_integrations.harbor.entrypoints.main_harbor_xh
uv_extras: [fsdp, harbor]
env: {RAY_worker_register_timeout_seconds: "300"}
overrides:
  trainer.algorithm.advantage_estimator: grpo
  trainer.algorithm.loss_reduction: token_mean
  trainer.algorithm.grpo_norm_by_std: "false"
  trainer.algorithm.use_kl_loss: "false"
  trainer.algorithm.off_policy_correction.tis_ratio_type: token
  trainer.algorithm.off_policy_correction.token_tis_ratio_clip_high: "2.0"
  trainer.placement.colocate_all: "true"
  trainer.strategy: fsdp
  trainer.policy.fsdp_config.cpu_offload: "true"
  trainer.ref.fsdp_config.cpu_offload: "true"
  trainer.placement.policy_num_nodes: "1"
  trainer.placement.ref_num_nodes: "1"
  trainer.placement.policy_num_gpus_per_node: "2"
  trainer.placement.ref_num_gpus_per_node: "2"
  generator.inference_engine.num_engines: "1"
  generator.inference_engine.tensor_parallel_size: "2"
  generator.inference_engine.engine_init_kwargs.max_model_len: "24576"
  generator.sampling_params.max_generate_length: "8192"
  trainer.algorithm.max_seq_len: "24576"
  trainer.eval_interval: "-1"
  trainer.eval_before_train: "false"
  trainer.update_epochs_per_batch: "1"
  trainer.train_batch_size: "24"
  trainer.policy_mini_batch_size: "24"
  trainer.micro_forward_batch_size_per_gpu: "1"
  trainer.micro_train_batch_size_per_gpu: "1"
  trainer.ckpt_interval: "5"
  trainer.hf_save_interval: "5"
  trainer.policy.optimizer_config.lr: "1.0e-6"
  generator.step_wise_trajectories: "true"
  generator.merge_stepwise_output: "true"
  generator.n_samples_per_prompt: "6"
  generator.apply_overlong_filtering: "true"
  generator.inference_engine.gpu_memory_utilization: "0.75"
  generator.inference_engine.backend: vllm
  generator.inference_engine.run_engines_locally: "true"
  generator.inference_engine.weight_sync_backend: nccl
  generator.batched: "false"
  generator.inference_engine.enforce_eager: "false"
  trainer.logger: wandb
  trainer.project_name: harbor
  trainer.resume_mode: none
  generator.rate_limit.enabled: "true"
  generator.rate_limit.trajectories_per_second: "1"
  generator.rate_limit.max_concurrency: "24"
