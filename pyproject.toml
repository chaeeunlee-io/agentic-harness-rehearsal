[project]
name = "harness-competence"
version = "0.1.0"
description = "Command line for the harness-competence experiments"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "requests>=2"]   # requests: the MAB rehearsal generator imports the tasks' FHIR logic

[project.scripts]
exp = "exp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["exp"]
