<text x="69" y="34" font-size="6" font-weight="700" style="fill:#2e8fd4">Rehearsal task ρ(x)</text>
<g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="4.3" style="fill:#2e8fd4">
<text x="69" y="42.5">1. Call get(url=…</text>
<text x="69" y="48.5" xml:space="preserve">   Observation?patient=</text>
<text x="69" y="54.5" xml:space="preserve">   S3032536&amp;code=MG…)</text>
<text x="69" y="61">2. Latest effective-</text>
<text x="69" y="67" xml:space="preserve">   DateTime → V =</text>
<text x="69" y="73" xml:space="preserve">   valueQuantity.value</text>
<text x="69" y="80.5">3. none → finish([-1])</text>
<text x="69" y="86.5" xml:space="preserve">   else → finish([V])</text>
</g>

<rect x="8" y="104" width="120" height="18" fill="#eff3f6" stroke="#a3a8ae" stroke-width="0.5"></rect>
